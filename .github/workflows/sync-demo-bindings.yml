name: Sync demo bindings (manual)

# PASSO 2 da auditoria de simuladores: aplica migrações pendentes (ex.:
# 0006 — colunas questions.subtopic/demo_params/numeric_expr) e sincroniza
# o banco com a vinculação de demos por SUBTÓPICO:
#   1. topics.demo_id ← curriculo.json (demo da lição)
#   2. questions.subtopic/demo_params/numeric_expr ← seeds (match por enunciado)
#   3. questions.demo_id ← resolvido do subtópico pelo catálogo em código
# Uso: aba Actions → "Sync demo bindings (manual)" → Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar bun
        uses: oven-sh/setup-bun@v2

      - name: Aplicar migrações pendentes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun scripts/migrate.ts

      - name: Rodar sync-demo-bindings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun scripts/sync-demo-bindings.ts

      - name: Auditar todas as questões do banco (cega + mathjs)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # SDK do segundo modelo (efêmero — não altera o repositório)
          bun add z-ai-web-dev-sdk@0.0.18
          bun scripts/audit-questions.ts --db
